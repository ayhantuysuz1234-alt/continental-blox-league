<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Continental Blox League</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d14;--card:#121826;--bd:#222b3d;--tx:#f3f5f9;--mu:#8d97ab;--ac:#e5243b;--bl:#3b82f6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Barlow","Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0 0 .5rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#0a0d14ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.nw{max-width:1180px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font:700 22px "Barlow Condensed",Impact,sans-serif;letter-spacing:.06em}
.logo i{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--bl));display:grid;place-items:center;font-style:normal;font-size:13px}
.links{display:flex;gap:2px;overflow-x:auto;flex:1}.links a{padding:6px 10px;border-radius:6px;color:var(--mu);white-space:nowrap;font-size:14px}.links a:hover,.links a.on{color:var(--tx);background:var(--card)}
input,select,button,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer;background:var(--ac);border-color:var(--ac);font-weight:600}button.g{background:var(--card);border-color:var(--bd)}button:hover{filter:brightness(1.15)}
main{max-width:1180px;margin:auto;padding:20px 16px 60px;animation:f .35s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.hero{border:1px solid var(--bd);border-radius:16px;padding:48px 28px;background:radial-gradient(circle at 85% 0,#3b82f633,transparent 50%),radial-gradient(circle at 0 100%,#e5243b2e,transparent 50%),var(--card);margin-bottom:24px}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1}.hero p{color:var(--mu);max-width:560px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;transition:border-color .2s,transform .2s}a.card:hover{border-color:var(--bl);transform:translateY(-2px)}
.sec{margin:28px 0 10px;display:flex;justify-content:space-between;align-items:baseline}.mu{color:var(--mu)}.sm{font-size:13px}
.bd{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font:700 12px sans-serif;color:#fff;flex:none}.bd.l{width:84px;height:84px;font-size:26px}
.fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.fx:last-child{border:0}
.fx .t{display:flex;align-items:center;gap:8px}.fx .t:last-child{justify-content:flex-end;text-align:right}.sc{font:700 20px "Barlow Condensed",sans-serif;background:var(--bg);padding:2px 12px;border-radius:6px;white-space:nowrap}
.ow{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}td:nth-child(2),th:nth-child(2){text-align:left}td b{color:var(--tx)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin-left:6px}.tag.v{color:#4ade80;border-color:#4ade8066}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}label{display:grid;gap:3px;font-size:13px;color:var(--mu)}
.news{display:block}.cov{height:110px;border-radius:8px;margin-bottom:10px;background:linear-gradient(135deg,var(--bl),var(--ac));opacity:.85}
footer{border-top:1px solid var(--bd);padding:24px;text-align:center;color:var(--mu);font-size:13px}
:root{--bg:#0a0a0b;--card:#131315;--bd:#232327;--tx:#f5f5f3;--mu:#8b8b92;--ac:#d63a3a;--bl:#3a3a40}
body{font-family:Inter,Geist,'Segoe UI',system-ui,sans-serif;font-weight:450;letter-spacing:-.005em}
h1,h2,h3{font-family:inherit;text-transform:none;font-weight:800;letter-spacing:-.03em}h1{font-size:clamp(28px,4.5vw,42px);margin-bottom:1rem}h2{font-size:20px}h3{font-size:17px}
main{animation:none}main.x{animation:pg .28s ease}@keyframes pg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){main.x{animation:none}}
.logo{font:800 16px Inter,sans-serif;letter-spacing:.04em}.logo i{background:var(--ac);border-radius:8px;font-size:11px;font-weight:800}
.links a{font-weight:500;border-radius:0}.links a.on{background:transparent;box-shadow:inset 0 -2px var(--ac)}.links a:hover{background:transparent;color:var(--tx)}
.hero{background:var(--card);padding:56px 32px}.hero h1{font-size:clamp(36px,7vw,66px);letter-spacing:-.045em}
.card{border-radius:10px}a.card:hover{border-color:#44444a;transform:none}
.bd{background:#1d1d21;border:1px solid var(--bd);color:var(--tx);font:700 10px Inter,sans-serif;letter-spacing:.04em}.bd.l{font-size:20px}
.cov{background:#1d1d21;opacity:1}.sc{font:800 17px Inter,sans-serif;background:#1d1d21}.tag,.tag.v{border-radius:4px;color:var(--mu);border-color:var(--bd)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}button{border-radius:8px}.tb.on{background:var(--tx);color:#000;border-color:var(--tx)}
img.bd{border:0!important;border-radius:0!important;background:transparent!important;object-fit:contain!important}.bd{flex:none}
.bd{display:inline-grid;vertical-align:middle;margin:0}.cn,td a,.cc,.fx .t,.row.hd{display:inline-flex;align-items:center;gap:12px}.cn{display:flex}.cc{display:flex;gap:16px}.cc h3{margin:0 0 4px}.fx .t{display:flex}.fx .t h2{margin:0}h1,h2,h3{line-height:1.2}
.fm{display:flex;gap:8px}.fb{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font:800 15px Inter,sans-serif;color:#fff}.fb.W{background:#16a34a}.fb.D{background:#6b7280}.fb.L{background:#991b1b}.fb:hover{filter:brightness(1.15)}
.tw{padding:3px 12px;border-radius:99px;font:800 12px Inter,sans-serif;color:#fff}.tw.on{background:#16a34a}.tw.off{background:#b91c1c}
.twbn{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px;border-left:4px solid}.twbn.on{border-left-color:#16a34a}.twbn.off{border-left-color:#b91c1c}.twbn p{margin:0;color:var(--mu)}.twt{font:800 24px Inter,sans-serif;letter-spacing:-.02em}button:disabled{opacity:.4;cursor:not-allowed;filter:none}
</style></head><body>
